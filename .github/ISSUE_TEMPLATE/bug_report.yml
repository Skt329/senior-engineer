name: Bug report
description: A guard got a command wrong, a rule misfired, or the plugin did not load.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Before you paste a transcript, remove tokens, keys, and anything else private.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - A guard blocked or asked about something safe
        - A guard let through something it should have stopped
        - A rule or skill made Claude behave badly
        - The plugin did not install or load
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What Claude tried, what the plugin did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command or file path
      description: For guard problems, copy the command line or file path from the transcript exactly as Claude sent it.
      render: text
  - type: dropdown
    id: tool
    attributes:
      label: Which tool ran it?
      options:
        - Bash
        - PowerShell
        - Read, Edit, or Write
        - Agent (a subagent spawn)
        - Not a tool call
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
      placeholder: 2.1.284 (Claude Code)
    validations:
      required: true
  - type: input
    id: powershell-version
    attributes:
      label: PowerShell version
      description: Output of `$PSVersionTable.PSVersion` in the PowerShell that runs the hooks (Windows PowerShell by default).
      placeholder: "5.1.26100.1"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown in the /plugin menu, or in .claude-plugin/plugin.json.
      placeholder: 0.1.0
  - type: textarea
    id: debug-output
    attributes:
      label: Hook output (optional)
      description: If you can, start Claude Code with `claude --debug`, repeat the problem, and paste the lines for the senior-engineer hook.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
